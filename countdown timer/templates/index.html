<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Timer</title>
  <meta name="description" content="A stunning Python-powered countdown timer. Set your time, hit Start, and get an alarm when it's done!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <!-- Animated background blobs -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="container">

    <!-- ── Header ── -->
    <header>
      <div class="logo">⏱</div>
      <h1>Countdown Timer</h1>
      <p class="subtitle">Set your time &amp; stay on track — powered by Python &amp; Flask</p>
    </header>

    <!-- ── Input Card ── -->
    <div class="card input-card">
      <h2 class="card-title">Set Timer</h2>

      <div class="time-inputs">
        <div class="time-field">
          <label for="hours">Hours</label>
          <input type="number" id="hours" min="0" max="23" value="0" />
        </div>
        <div class="separator">:</div>
        <div class="time-field">
          <label for="minutes">Minutes</label>
          <input type="number" id="minutes" min="0" max="59" value="0" />
        </div>
        <div class="separator">:</div>
        <div class="time-field">
          <label for="seconds">Seconds</label>
          <input type="number" id="seconds" min="0" max="59" value="10" />
        </div>
      </div>

      <!-- Quick preset chips -->
      <div class="presets">
        <span class="presets-label">Quick Set:</span>
        <button class="preset-btn" data-seconds="60">1 min</button>
        <button class="preset-btn" data-seconds="300">5 min</button>
        <button class="preset-btn" data-seconds="600">10 min</button>
        <button class="preset-btn" data-seconds="1800">30 min</button>
        <button class="preset-btn" data-seconds="3600">1 hr</button>
      </div>
    </div>

    <!-- ── Timer Display Card ── -->
    <div class="card timer-card">

      <!-- Circular ring progress -->
      <div class="ring-container">
        <svg class="progress-ring" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%"   style="stop-color:#a78bfa" />
              <stop offset="50%"  style="stop-color:#818cf8" />
              <stop offset="100%" style="stop-color:#38bdf8" />
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <circle class="ring-track"    cx="140" cy="140" r="120" />
          <circle class="ring-progress" id="ring-progress" cx="140" cy="140" r="120" filter="url(#glow)" />
        </svg>

        <div class="time-display">
          <span class="time-digits" id="timer-text">00:00:10</span>
          <span class="time-label"  id="timer-label">Ready</span>
        </div>
      </div>

      <!-- Control Buttons -->
      <div class="controls">
        <button class="btn btn-secondary" id="reset-btn" title="Reset">
          <!-- Reset icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>

        <button class="btn btn-primary" id="start-btn" title="Start / Pause">
          <svg id="play-icon" xmlns="http://www.w3.org/2000/svg"
               width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg"
               width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none">
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>

        <button class="btn btn-secondary" id="stop-btn" title="Stop">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
               viewBox="0 0 24 24" fill="currentColor">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
        </button>
      </div>

      <!-- Linear progress bar -->
      <div class="linear-progress-container">
        <div class="linear-progress" id="linear-progress"></div>
      </div>
    </div>

    <!-- ── Alert Banner (shown on completion) ── -->
    <div class="alert-banner" id="alert-banner">
      <div class="alert-icon">🎉</div>
      <div class="alert-text">
        <strong>Time's Up!</strong>
        <span>Your countdown has finished.</span>
      </div>
      <button class="alert-dismiss" id="alert-dismiss">✕</button>
    </div>

    <!-- ── Footer ── -->
    <footer class="site-footer">
      Built with <span class="heart">♥</span> using
      <span class="tech-badge">Python</span>
      <span class="tech-badge">Flask</span>
      <span class="tech-badge">Vercel</span>
    </footer>

  </div><!-- /container -->

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
